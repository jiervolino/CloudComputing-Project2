# Docker Compose runs three services:
# 1. weather-app: Go HTTP API and Kafka producer
# 2. kafka: Apache Kafka message broker
# 3. weather-consumer: Go weather alert evaluator

services:
  weather-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # API key loaded from the local .env file
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:?Set API key in .env}
      # Kafka broker address inside Docker
      KAFKA_BROKER: kafka:9092
    depends_on:
      - kafka

  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    # Bind Kafka to the local computer only
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
  
  weather-consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    environment:
      KAFKA_BROKER: kafka:9092
      # Temperature thresholds in Fahrenheit
      HIGH_TEMP_THRESHOLD: "90"
      LOW_TEMP_THRESHOLD: "32"
      # Wind speed threshold in mph
      HIGH_WIND_THRESHOLD: "25"
    depends_on:
      - kafka
    # Restart consumer if it exits unexpectedly
    restart: unless-stopped


volumes:
  kafka-data:
