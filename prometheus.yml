
# Prometheus configuration for weather monitoring

global:
  # Collect metrics every 5 seconds
  scrape_interval: 5s

scrape_configs:
  # Monitor the Go weather API
  - job_name: "weather-app"
    static_configs:
      - targets: ["weather-app:8080"]

  # Monitor the Kafka weather alert consumer
  - job_name: "weather-consumer"
    static_configs:
      - targets: ["weather-consumer:8081"]
